services:
  - type: web
    name: maintainerlens-live
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "7860"
      - key: MAINTAINERLENS_PUBLIC_DEMO
        value: "1"
      - key: MAINTAINERLENS_PUBLIC_GENERATION
        value: "1"
      - key: MAINTAINERLENS_DEMO_ACCESS_KEY
        generateValue: true
