name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-semantic.txt
      - name: Run Python tests
        run: |
          python -m pip install -r requirements.txt -r requirements-semantic.txt
          python -m unittest discover -s tests
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Vue dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:demo
      - name: Build Docker demo
        run: docker build -t maintainerlens-ci .
      - name: Smoke-test Docker demo
        run: |
          docker run -d --name maintainerlens-ci -p 127.0.0.1:7860:7860 maintainerlens-ci
          python tests/smoke_demo.py http://127.0.0.1:7860
      - name: Show container logs on failure
        if: failure()
        run: docker logs --tail 100 maintainerlens-ci || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f maintainerlens-ci || true
